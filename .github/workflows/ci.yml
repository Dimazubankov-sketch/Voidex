name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: voidex
          POSTGRES_PASSWORD: voidex
          POSTGRES_DB: voidex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voidex" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://voidex:voidex@localhost:5432/voidex
      TEST_DATABASE_URL: postgres://voidex:voidex@localhost:5432/voidex_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: PGPASSWORD=voidex psql -h localhost -U voidex -c "create database voidex_test"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: End-to-end
        run: |
          pnpm db:migrate
          npx --prefix apps/web playwright install --with-deps chromium
          RATE_LIMIT_SCALE=50 pnpm test:e2e
