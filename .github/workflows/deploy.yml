name: Deploy

# Every push to main is tested, packaged and released to https://voidex.su.
# The image is built here (not on the 2 GB server); the server only pulls it.
# A failed build or failed tests never touch the running version, and a
# release that fails its health checks is replaced by the previous one.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sms_provider:
        description: "SMS provider for this release (empty = GitHub variable SMS_PROVIDER, else smsaero)"
        type: choice
        options: ["", otpcom, smsaero]
        default: ""

# Releases run one at a time, in order; a running release is never cancelled.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/dimazubankov-sketch/voidex
  DEPLOY_HOST: 161.35.135.122
  DEPLOY_USER: deploy
  SITE: https://voidex.su

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/ci.yml

  image:
    name: Build image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ env.IMAGE }}:${{ github.sha }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: VOIDEX_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to voidex-01
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://voidex.su
    steps:
      - name: Prepare SSH (deploy key from GitHub Secrets)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::Secrets DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS are not set. See docs/DEPLOYMENT.md → First-time setup."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          if printf '%s' "$DEPLOY_SSH_KEY" | grep -q "BEGIN OPENSSH PRIVATE KEY"; then
            printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          else
            printf '%s' "$DEPLOY_SSH_KEY" | tr -d ' \r\n' | base64 -d > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host voidex
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          CFG

      - name: Release ${{ github.sha }} on the server
        # The deploy key can only run the deploy command. Secrets travel on
        # stdin (never in the command line, never echoed; GitHub masks them):
        #   line 1: short-lived GITHUB_TOKEN so the server can pull the image
        #   lines 2–5: OTP_API_KEY, SMS_AERO_API_KEY, SMS_AERO_EMAIL, SMS_AERO_SIGN
        #              → /opt/voidex/state/secrets.env (mode 600); empty = keep
        #   line 6: requested SMS provider (not secret): the run input, else the
        #           repository variable SMS_PROVIDER, else smsaero (production default)
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OTP_API_KEY: ${{ secrets.OTP_API_KEY }}
          SMS_AERO_API_KEY: ${{ secrets.SMS_AERO_API_KEY }}
          SMS_AERO_EMAIL: ${{ secrets.SMS_AERO_EMAIL }}
          SMS_AERO_SIGN: ${{ vars.SMS_AERO_SIGN }}
          SMS_PROVIDER: ${{ inputs.sms_provider || vars.SMS_PROVIDER || 'smsaero' }}
        run: |
          echo "Requested SMS provider: ${SMS_PROVIDER:-auto}"
          printf '%s\n%s\n%s\n%s\n%s\n%s\n' "$REGISTRY_TOKEN" "$OTP_API_KEY" "$SMS_AERO_API_KEY" "$SMS_AERO_EMAIL" "$SMS_AERO_SIGN" "$SMS_PROVIDER" |
            ssh voidex "deploy $GITHUB_SHA"

      - name: Verify https://voidex.su
        env:
          OTP_KEY_SET: ${{ secrets.OTP_API_KEY != '' }}
          SMS_PROVIDER: ${{ inputs.sms_provider || vars.SMS_PROVIDER || 'smsaero' }}
        run: |
          set -u
          fail() { echo "::error::$1"; exit 1; }
          echo "Waiting for $SITE/api/health to report ${GITHUB_SHA::7}…"
          for i in $(seq 1 20); do
            body=$(curl -fsS --max-time 10 "$SITE/api/health" 2>/dev/null || true)
            case "$body" in *"\"revision\":\"$GITHUB_SHA\""*) break ;; esac
            sleep 6
          done
          case "$body" in
            *"\"revision\":\"$GITHUB_SHA\""*) echo "✔ /api/health 200 — $body" ;;
            *) fail "https://voidex.su/api/health is not serving this release yet. The server itself passed its checks — if this is the first deployment, check the DNS records for voidex.su (docs/DEPLOYMENT.md). Response: ${body:-none}" ;;
          esac
          html=$(curl -fsS --max-time 10 "$SITE/") || fail "Front page did not load"
          case "$html" in *'<div id="root">'*) ;; *) fail "Front page has no app root" ;; esac
          asset=$(printf '%s' "$html" | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          [ -n "$asset" ] || fail "Front page references no script"
          curl -fsS --max-time 10 -o /dev/null "$SITE$asset" || fail "Frontend script $asset did not load"
          echo "✔ Frontend loads ($asset)"
          info=$(curl -fsS --max-time 10 "$SITE/api/system/info") || fail "/api/system/info did not answer"
          sms=$(printf '%s' "$info" | grep -oE '"smsProvider":"[a-z]+"' | cut -d'"' -f4)
          expected=""
          if [ "$SMS_PROVIDER" = "smsaero" ]; then expected=smsaero; elif [ "$OTP_KEY_SET" = "true" ]; then expected=otpcom; fi
          if [ -n "$expected" ]; then
            case "$info" in
              *"\"smsProvider\":\"$expected\""*'"smsDevMode":false'*'"smsAvailable":true'*) echo "✔ SMS provider: $expected (phone verification available, not dev mode)" ;;
              *) fail "SMS provider is '$sms', expected $expected — see the server log (Production → logs)." ;;
            esac
          else
            echo "• SMS provider: $sms"
          fi
          code=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://voidex.su/)
          case "$code" in 30[18]\ https://voidex.su/*) echo "✔ HTTP → HTTPS ($code)" ;; *) fail "HTTP is not redirected to HTTPS: $code" ;; esac
          code=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' https://www.voidex.su/)
          case "$code" in 30[18]\ https://voidex.su/*) echo "✔ www → voidex.su ($code)" ;; *) echo "::warning::www.voidex.su redirect not working yet: $code" ;; esac
          echo "✅ https://voidex.su is live on ${GITHUB_SHA::7}"
