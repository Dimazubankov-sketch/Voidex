<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ececed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="VOIDEX — your unified digital space." />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-64.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>VOIDEX</title>
    <!-- Critical first paint, independent of every external file: background, wordmark, and (pure CSS, no script) a
         hint with a plain link that appears after 10 s if nothing has replaced it. React replaces #root's content. -->
    <style>
      html, body { margin: 0; height: 100%; background: #ececed; color: #1d1d1f; }
      @media (prefers-color-scheme: dark) { html, body { background: #121218; color: #f2f2f7; } }
      #vx-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 32px; text-align: center; font: 600 20px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.14em; }
      #vx-splash small { font: 400 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; letter-spacing: 0; opacity: 0; max-width: 320px; animation: vx-hint 0.4s ease 10s forwards; }
      #vx-splash a { color: #6c5cff; font-weight: 600; }
      @keyframes vx-hint { to { opacity: 0.8; } }
    </style>
    <script async src="/boot-guard.js"></script>
  </head>
  <body>
    <div id="root"><div id="vx-splash"><span>VOIDEX</span><small>Загрузка идёт долго. Проверьте подключение · Taking long, check your connection.<br /><a href="/">Обновить · Reload</a></small></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
