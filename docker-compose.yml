services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: voidex
      POSTGRES_PASSWORD: voidex
      POSTGRES_DB: voidex
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voidex"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["4000:4000"]
    environment:
      DATABASE_URL: postgres://voidex:voidex@db:5432/voidex
      # Replace before deploying anywhere real:
      AUTH_ACCESS_SECRET: ${AUTH_ACCESS_SECRET:?set AUTH_ACCESS_SECRET}
      AUTH_TOKEN_PEPPER: ${AUTH_TOKEN_PEPPER:?set AUTH_TOKEN_PEPPER}
      SMS_PROVIDER: ${SMS_PROVIDER:?set SMS_PROVIDER (twilio or smsru)}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      SMSRU_API_ID: ${SMSRU_API_ID:-}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-voidex.app}
      TRUST_PROXY: "true"

volumes:
  pgdata:
